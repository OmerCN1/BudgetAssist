openapi: 3.0.3
info:
  title: BudgetAssist — Edge Function API
  description: |
    BudgetAssist uygulamasının Supabase Edge Function endpoint'leri.
    Tüm endpoint'ler JWT kimlik doğrulaması gerektirir.
    CORS: localhost:5173, localhost:4173, budgetassist.vercel.app
  version: 1.0.0
  contact:
    name: BudgetAssist Geliştirici Ekibi

servers:
  - url: https://xfmbxqkowwoyxxunylhr.supabase.co/functions/v1
    description: Production (Supabase)
  - url: http://localhost:54321/functions/v1
    description: Yerel geliştirme (supabase start)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth'tan alınan kullanıcı JWT access token'ı

  schemas:
    # ── ai-coach ────────────────────────────────────────────────────────────────
    AiCoachRequest:
      type: object
      required:
        - message
        - summary
      properties:
        message:
          type: string
          description: Kullanıcının soru veya isteği
          example: "Bu ay en çok hangi kategoriye harcama yaptım?"
        summary:
          type: object
          description: Kullanıcının finansal özet verisi
          properties:
            totalIncome:
              type: number
              example: 8500
            totalExpenses:
              type: number
              example: 6200
            netCashFlow:
              type: number
              example: 2300
            categories:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  spent: { type: number }
                  budget: { type: number }
            transactions:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, enum: [income, expense] }
                  amount: { type: number }
                  category: { type: string }
                  date: { type: string, format: date }

    AiCoachInsight:
      type: object
      required: [type, title, body, severity]
      properties:
        type:
          type: string
          example: "budget_warning"
        title:
          type: string
          example: "Market harcamaları yüksek"
        body:
          type: string
          example: "Bu ay market kategorisinde bütçenizin %95'ini kullandınız."
        severity:
          type: string
          enum: [info, success, warning, danger]

    AiCoachResponse:
      type: object
      required: [reply, insights]
      properties:
        reply:
          type: string
          description: Kullanıcıya gösterilecek sohbet yanıtı (4-6 cümle veya madde listesi)
          example: "Bu ay toplam 6.200 TL harcama yaptınız. En yüksek kalem Market (1.800 TL) oldu..."
        insights:
          type: array
          description: Yan panel için 1-3 kısa içgörü kartı
          items:
            $ref: '#/components/schemas/AiCoachInsight'

    # ── receipt-scanner ─────────────────────────────────────────────────────────
    ReceiptScannerRequest:
      type: object
      required:
        - imageDataUrl
      properties:
        imageDataUrl:
          type: string
          description: Base64 kodlanmış görsel (data:image/jpeg;base64,... formatında)
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgAB..."
        fileName:
          type: string
          description: Opsiyonel dosya adı (debug için)
          example: "fis_market.jpg"

    ReceiptItem:
      type: object
      required: [name, qty, unitPrice, totalPrice]
      properties:
        name: { type: string, example: "Süt 1L" }
        qty: { type: number, example: 2 }
        unitPrice: { type: number, example: 12.50 }
        totalPrice: { type: number, example: 25.00 }

    ReceiptScannerResponse:
      type: object
      required: [merchant, amount, date, paymentMethod, notes, confidence, items]
      properties:
        merchant:
          type: string
          description: İşletme/mağaza adı
          example: "BİM Mağazaları"
        amount:
          type: number
          description: KDV dahil toplam tutar (TL)
          example: 284.50
        date:
          type: string
          format: date
          description: İşlem tarihi (YYYY-MM-DD)
          example: "2026-05-14"
        paymentMethod:
          type: string
          enum: [Kart, Nakit, Banka, Dijital]
          example: "Kart"
        notes:
          type: string
          description: Ek notlar veya çıkarım güçlüğü uyarısı
          example: ""
        confidence:
          type: number
          minimum: 0
          maximum: 100
          description: Çıkarım güven skoru (0-100)
          example: 92
        items:
          type: array
          description: Fişteki ürün kalemleri
          items:
            $ref: '#/components/schemas/ReceiptItem'

    # ── send-notifications ──────────────────────────────────────────────────────
    SendNotificationsRequest:
      type: object
      properties:
        type:
          type: string
          enum: [alert, weekly]
          default: alert
          description: |
            alert: Anlık bildirim (bütçe aşımı, negatif nakit akışı, yaklaşan ödeme)
            weekly: Haftalık özet e-posta/SMS

    NotificationItem:
      type: object
      required: [id, severity, title, body]
      properties:
        id: { type: string, example: "budget-abc123" }
        severity:
          type: string
          enum: [danger, warning, success, info]
        title: { type: string, example: "Market bütçesi aşıldı" }
        body: { type: string, example: "850.00 / 700.00 TL kullanıldı (%121)" }
        value: { type: string, example: "%121" }

    SendNotificationsResponse:
      type: object
      required: [ok, processed, results]
      properties:
        ok:
          type: boolean
          example: true
        processed:
          type: integer
          description: İşlenen kullanıcı sayısı
          example: 1
        results:
          type: object
          description: Kullanıcı ID bazlı e-posta/SMS gönderim sonucu
          additionalProperties:
            type: object
            properties:
              email:
                type: object
                properties:
                  sent: { type: boolean }
                  error: { type: string }
              sms:
                type: object
                properties:
                  sent: { type: boolean }
                  error: { type: string }

    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: "UNAUTHORIZED_INVALID_JWT_FORMAT" }
        message: { type: string, example: "Invalid JWT" }

paths:
  /ai-coach:
    post:
      summary: AI Finansal Koç
      description: |
        Kullanıcının finansal verilerini ve sorusunu alarak Türkçe sohbet yanıtı + içgörü kartları döndürür.
        Groq API üzerinden çalışır. GROQ_API_KEY ayarlanmamışsa yapılandırma uyarısı döner.
      operationId: aiCoach
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCoachRequest'
            example:
              message: "Bu ay en çok hangi kategoriye harcama yaptım?"
              summary:
                totalIncome: 8500
                totalExpenses: 6200
                netCashFlow: 2300
      responses:
        '200':
          description: Başarılı yanıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCoachResponse'
        '401':
          description: Kimlik doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Sunucu hatası (Groq API erişim hatası vb.)

  /receipt-scanner:
    post:
      summary: Fiş Tarayıcı
      description: |
        Base64 görsel alır, Groq Llama Vision ile fiş verilerini çıkarır.
        Desteklenen formatlar: JPEG, PNG, WebP.
        GROQ_API_KEY ayarlanmamışsa boş yapılı yanıt döner (confidence: 0).
      operationId: receiptScanner
      tags: [OCR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptScannerRequest'
      responses:
        '200':
          description: Başarılı tarama sonucu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptScannerResponse'
        '400':
          description: Geçersiz istek (imageDataUrl eksik veya yanlış format)
        '401':
          description: Kimlik doğrulama hatası

  /send-notifications:
    post:
      summary: Bildirim Gönder
      description: |
        Kullanıcının finansal verisini Supabase DB'den çekerek bütçe uyarısı,
        tekrarlı ödeme hatırlatması, hedef bildirimi oluşturur ve e-posta/SMS gönderir.
        Kullanıcı profilindeki notification_email / notification_sms bayraklarına göre çalışır.
      operationId: sendNotifications
      tags: [Notifications]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationsRequest'
            example:
              type: "alert"
      responses:
        '200':
          description: Bildirim işlemi tamamlandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendNotificationsResponse'
        '401':
          description: Kimlik doğrulama hatası

tags:
  - name: AI
    description: Yapay zeka destekli finansal danışmanlık
  - name: OCR
    description: Fiş/fatura görsel işleme
  - name: Notifications
    description: Bütçe uyarıları ve bildirim gönderimi
